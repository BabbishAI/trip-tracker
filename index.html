<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Tracker</title>
  <style>
    :root {
      --bg: #fafaf7;
      --ink: #1d1d1f;
      --muted: #6b6b6b;
      --accent: #0066cc;
      --border: #e3e3df;
      --row-alt: #f3f3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.45;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
    .panel {
      background: white; border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 20px;
    }
    .area-heading {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin: 4px 0 6px; font-weight: 600;
    }
    /* Plain item row */
    .v-row {
      display: grid; grid-template-columns: 24px 1fr auto; gap: 12px;
      align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border);
    }
    .v-row:last-child { border-bottom: none; }
    .v-row.excluded { opacity: 0.5; }
    .v-row.excluded .v-title { text-decoration: line-through; }
    .v-row.excluded .v-cost { text-decoration: line-through; }
    .v-check { transform: scale(1.25); }
    .v-check { width: auto; margin: 0; cursor: pointer; }
    .v-fixed { width: 18px; text-align: center; color: var(--muted); }
    .v-title { font-weight: 500; }
    .v-title .v-icon { margin-right: 6px; }
    .v-sub { display: block; margin-left: 24px; color: var(--muted); font-size: 0.78rem; }
    .v-cost { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
    .v-perperson { display: block; font-size: 0.74rem; color: var(--muted); font-weight: 400; margin-top: 1px; }

    /* Choice-group dropdown card */
    .v-group {
      border: 1px solid #d9d2ef; border-radius: 9px; background: #faf9fd;
      padding: 12px 14px; margin: 12px 0;
    }
    .v-group.none { opacity: 0.55; }
    .v-group-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .v-group-title { font-weight: 600; color: #3a2a6b; }
    .v-group-title .v-icon { margin-right: 6px; }
    .v-group-meta { color: var(--muted); font-size: 0.8rem; font-weight: 400; margin-left: 6px; }
    .v-group-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .v-group select {
      flex: 1 1 260px; padding: 9px 10px; border: 1px solid var(--border);
      border-radius: 7px; font-size: 0.95rem; background: white; color: var(--ink);
    }
    .v-group-cost { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .v-group-cost.none { color: var(--muted); font-weight: 400; font-style: italic; }

    /* Total */
    .total-panel {
      background: linear-gradient(180deg, white, #f7f4ec);
      border: 1px solid var(--border); border-top: 3px solid var(--accent);
    }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
    .total-row .label { color: var(--muted); font-size: 0.9rem; }
    .total-row .val { font-variant-numeric: tabular-nums; }
    .total-row.grand { margin-top: 8px; padding-top: 14px; border-top: 2px solid var(--ink); }
    .total-row.grand .label { color: var(--ink); font-size: 1rem; font-weight: 600; }
    .total-row.grand .val { font-size: 1.9rem; font-weight: 600; color: var(--accent); }
    .total-note { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }

    .empty { color: var(--muted); padding: 40px 6px; text-align: center; }
    .empty a { color: var(--accent); }

    @media (max-width: 560px) {
      .container { padding: 14px; }
      .v-row { grid-template-columns: 24px 1fr auto; }
    }

    /* Estimate-vs-actual + booking details in the shared view */
    .v-var { display: block; font-size: 0.72rem; font-weight: 500; margin-top: 1px; }
    .v-var.over { color: #b3261e; }
    .v-var.under { color: #1d7a45; }
    .v-badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
      font-size: 0.7rem; font-weight: 600; }
    .v-badge.st-est { background: #eef1f6; color: #5a6475; }
    .v-badge.st-booked { background: #e3f0ff; color: #1b5fa8; }
    .v-badge.st-paid { background: #e2f5e9; color: #1d7a45; }
    .v-conf { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.74rem; }
    table.v-ledger { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.v-ledger th { text-align: right; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: .03em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid #e6e9ef; }
    table.v-ledger th:first-child, table.v-ledger td:first-child { text-align: left; }
    table.v-ledger td { text-align: right; padding: 6px; border-bottom: 1px solid #f0f2f6; }
    table.v-ledger td.net.pos { color: #1d7a45; font-weight: 600; }
    table.v-ledger td.net.neg { color: #b3261e; font-weight: 600; }

    .you-head { font-size: 0.76rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .you-pick { width: 100%; max-width: 420px; font: inherit; font-size: 0.95rem;
      padding: 8px 10px; border: 1px solid #d7dce5; border-radius: 7px; background: #fff; }
    .you-note { font-size: 0.8rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .you-body { margin-top: 12px; }
    .you-big { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; }
    .you-big.neg { color: #b3261e; }
    .you-big.pos { color: #1d7a45; }
    .you-detail { margin-top: 10px; font-size: 0.86rem; }
    .you-detail summary { cursor: pointer; color: var(--muted); }
    table.you-lines { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.86rem; }
    table.you-lines td { padding: 5px 0; border-bottom: 1px solid #f0f2f6; }
    table.you-lines td.amt { text-align: right; font-weight: 600; white-space: nowrap; }
    table.v-ledger tr.is-me { background: #f3f8ff; }
    table.v-ledger tr.is-me td:first-child { font-weight: 700; }
    ul.settle { list-style: none; padding: 0; margin: 0; }
    ul.settle li { padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid #f0f2f6; }
    ul.settle li:last-child { border-bottom: none; }
    ul.settle li.is-me { font-weight: 600; }
    ul.settle .amt { float: right; }

    .v-detail { display: block; margin-top: 6px; }
    .v-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .v-chip { display: inline-block; padding: 1px 8px; border-radius: 9px;
      background: #eef1f6; color: #5a6475; font-size: 0.72rem; }
    .v-confbox { display: inline-flex; align-items: center; gap: 4px;
      background: #f2f6fc; border: 1px solid #d6e2f2; border-radius: 7px; padding: 1px 4px 1px 8px; }
    .v-conf { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; font-weight: 600; letter-spacing: .02em; color: #14396b; }
    .v-copy { font: inherit; font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; border: none; background: transparent; color: #1b5fa8;
      cursor: pointer; padding: 3px 5px; border-radius: 5px; }
    .v-copy:hover { background: #e2ecfa; }
    .v-link { display: inline-block; margin-top: 6px; font-size: 0.8rem; color: #1b5fa8; }
    .v-notes { margin-top: 6px; font-size: 0.8rem; color: #5a6475; line-height: 1.5;
      white-space: pre-wrap; }
    .v-notes-wrap { margin-top: 6px; }
    .v-notes-wrap > summary { list-style: none; cursor: pointer; font-size: 0.8rem;
      color: #5a6475; line-height: 1.5; }
    .v-notes-wrap > summary::-webkit-details-marker { display: none; }
    .v-notes-wrap > summary::after { content: " more"; color: #1b5fa8; font-weight: 600; font-size: 0.74rem; }
    .v-notes-wrap[open] > summary::after { content: " less"; }
    .v-notes-wrap[open] > summary { color: #98a0ad; }
    .v-notes-wrap > .v-notes { margin-top: 4px; }
    .v-split { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px;
      padding-top: 7px; border-top: 1px dashed #e6e9ef; font-size: 0.78rem; color: #5a6475; }
    .v-shr .n { color: #98a0ad; }
    details.v-refs summary { cursor: pointer; font-size: 0.76rem; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .v-count { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px;
      border-radius: 9px; background: #eef1f6; font-size: 0.7rem; text-align: center; }
    table.v-reftable { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.v-reftable td { padding: 7px 0; border-bottom: 1px solid #f0f2f6;
      font-size: 0.86rem; vertical-align: top; }
    table.v-reftable tr:last-child td { border-bottom: none; }
    table.v-reftable td.c { text-align: right; white-space: nowrap; padding-left: 10px; }
    .v-refwhen { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 1px; }
    /* --- Shared editing ------------------------------------------------- */
    /* Every control here writes to the one shared copy, so each is labelled with
       who it affects. Touch targets are sized for a phone at a hotel check-in. */
    .v-save { min-height: 20px; margin: -6px 0 14px; font-size: 0.8rem; color: var(--muted); }
    .v-save.pending { color: #8a6d00; }
    .v-save.ok { color: #1f7a3d; }
    .v-save.bad { color: #b3261e; font-weight: 600; }

    .v-tools { margin-top: 8px; }
    .v-del {
      padding: 5px 10px; min-height: 30px;
      border: 1px solid var(--border); border-radius: 7px;
      background: #fff; color: var(--muted);
      font-size: 0.76rem; font-family: inherit; cursor: pointer;
    }
    .v-del:hover { border-color: #d9b3b0; color: #b3261e; }
    .v-del.armed { border-color: #b3261e; background: #fdf1f0; color: #b3261e; font-weight: 600; }

    /* Participation toggles. "On" carries the family's share of this line; "off" is
       visibly struck through, because the difference decides who owes what. */
    .v-split-edit { gap: 6px; }
    .v-shrtog {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; min-height: 30px;
      border: 1px solid var(--border); border-radius: 999px;
      background: #fff; color: #98a0ad;
      font-size: 0.78rem; font-family: inherit; cursor: pointer;
    }
    .v-shrtog .mark { font-size: 0.72rem; }
    .v-shrtog:not(.on) .n { text-decoration: line-through; }
    .v-shrtog.on { border-color: #c8dcf2; background: #f2f8ff; color: #2b3a4d; }
    .v-shrtog.on .n { color: #2b3a4d; font-weight: 600; }
    .v-shrtog.on .amt { color: #5a6475; }
    .v-shrtog:hover { border-color: var(--accent); }

    /* Add form */
    .v-addwrap { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .v-addwrap > summary {
      cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--accent);
      padding: 6px 0; list-style: none;
    }
    .v-addwrap > summary::-webkit-details-marker { display: none; }
    .v-addform {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
      margin-top: 10px; padding: 14px; border-radius: 10px; background: #f7f8fa;
    }
    .v-addform label { display: flex; flex-direction: column; gap: 4px;
      font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .v-addform label .opt { font-weight: 400; text-transform: none; color: #98a0ad; }
    .v-addform input, .v-addform select {
      padding: 8px 9px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .v-addform input:focus, .v-addform select:focus { outline: 2px solid #cfe1f7; border-color: var(--accent); }
    .v-addfams, .v-addhint, .v-addactions { grid-column: 1 / -1; }
    .v-addfams .lbl { display: block; font-size: 0.76rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .v-addfams .fams { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .v-addfams .fam { display: inline-flex; flex-direction: row; align-items: center; gap: 6px;
      font-size: 0.86rem; font-weight: 400; color: var(--ink); }
    .v-addhint { font-size: 0.76rem; color: var(--muted); }
    .v-addactions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .v-addactions button {
      padding: 9px 16px; min-height: 40px;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 0.88rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .v-addactions button:hover { background: #0055ad; }
    .v-addnote { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 520px) {
      .v-addform { grid-template-columns: 1fr; }
    }
    /* --- Per-item edit panel --------------------------------------------- */
    .v-edit {
      padding: 5px 10px; min-height: 30px; margin-right: 6px;
      border: 1px solid var(--border); border-radius: 7px;
      background: #fff; color: var(--accent);
      font-size: 0.76rem; font-family: inherit; cursor: pointer;
    }
    .v-edit:hover { border-color: var(--accent); }
    .v-edit.open { background: var(--accent); border-color: var(--accent); color: #fff; }

    .ed-panel {
      margin-top: 10px; padding: 14px;
      border: 1px solid #d8e4f2; border-radius: 10px; background: #f7fafd;
    }
    .ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .ed-wide { grid-column: 1 / -1; }
    .ed-field { display: flex; flex-direction: column; gap: 4px; }
    .ed-lab { font-size: 0.74rem; font-weight: 600; color: var(--muted); }
    .ed-hint { font-size: 0.7rem; color: #98a0ad; line-height: 1.3; }
    .ed-field input, .ed-field select, .ed-field textarea {
      padding: 8px 9px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
      width: 100%;
    }
    .ed-field textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
    .ed-field input:focus, .ed-field select:focus, .ed-field textarea:focus {
      outline: 2px solid #cfe1f7; border-color: var(--accent);
    }
    .ed-foot {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2ebf5;
    }
    .ed-done {
      padding: 8px 16px; min-height: 36px;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 0.84rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .ed-done:hover { background: #0055ad; }
    .ed-footnote { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 520px) {
      .ed-grid { grid-template-columns: 1fr; }
    }
    /* Participant counts for a per-person price */
    .ed-heads { display: flex; flex-wrap: wrap; gap: 8px; }
    .ed-head {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; background: #fff;
    }
    .ed-headname { font-size: 0.8rem; font-weight: 600; color: var(--ink); }
    .ed-head input {
      width: 56px; min-height: 32px; padding: 4px 6px; text-align: center;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.9rem; font-family: inherit;
    }
    .ed-headcap { font-size: 0.72rem; color: #98a0ad; white-space: nowrap; }
    .v-shrtog .cnt { font-size: 0.72rem; color: #5a6475; font-variant-numeric: tabular-nums; }
    .v-shrtog.on .cnt { color: #2b3a4d; }
    /* Categories */
    .v-cat { background: #eef4fb; border-color: #d8e4f2; color: #33506f; font-weight: 600; }
    .cat-head { font-size: 0.76rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .cat-list { display: flex; flex-direction: column; }
    .cat-row { display: flex; justify-content: space-between; align-items: baseline;
      gap: 12px; padding: 7px 0; border-bottom: 1px solid #f0f2f6; font-size: 0.9rem; }
    .cat-row:last-child { border-bottom: none; }
    .cat-name { color: var(--ink); }
    .cat-amt { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
    /* "What if someone chips in" — a private calculator, styled apart from the
       shared controls so it never reads as an edit to the plan. */
    .gift-field { display: flex; flex-direction: column; gap: 4px; }
    .gift-lab { font-size: 0.74rem; font-weight: 600; color: var(--muted); }
    .gift-field select, .gift-field input {
      padding: 8px 9px; min-height: 38px; width: 100%;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .gift-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .gift-preset {
      padding: 6px 12px; min-height: 32px;
      border: 1px solid var(--border); border-radius: 999px; background: #fff;
      font-size: 0.8rem; font-family: inherit; color: var(--accent); cursor: pointer;
    }
    .gift-preset:hover { border-color: var(--accent); background: #f2f8ff; }
    .gift-out { margin-top: 14px; }
    .gift-empty { font-size: 0.86rem; color: var(--muted); }
    table.gift-table { width: 100%; border-collapse: collapse; }
    table.gift-table th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); text-align: left; padding-bottom: 6px; font-weight: 700; }
    table.gift-table th.n, table.gift-table td.n { text-align: right; white-space: nowrap; }
    table.gift-table td { padding: 8px 0; border-bottom: 1px solid #f0f2f6; font-size: 0.9rem;
      font-variant-numeric: tabular-nums; }
    table.gift-table tr:last-child td { border-bottom: none; }
    table.gift-table tr.giver td { font-weight: 600; }
    .gift-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      background: #eef4fb; color: #33506f; font-size: 0.68rem; font-weight: 600; }
    .gift-delta { display: block; font-size: 0.74rem; font-weight: 600; }
    .gift-delta.down { color: #1f7a3d; }
    .gift-delta.up { color: #8a6d00; }
    .gift-note { margin-top: 10px; font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
    .gift-note.warn { color: #8a6d00; }

    @media (max-width: 520px) {
    }
    .gift-head { margin-bottom: 12px; font-size: 0.86rem; color: var(--ink); line-height: 1.45; }
    .gift-head.warn { color: #8a6d00; }
    /* Contribution calculator, nested inside the viewer's own panel */
    .you-gift { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .you-gift > summary { cursor: pointer; font-size: 0.84rem; font-weight: 600;
      color: var(--accent); list-style: none; padding: 2px 0; }
    .you-gift > summary::-webkit-details-marker { display: none; }
    .you-gift .gift-field { margin-top: 10px; }
    /* Collapsible rows. The header is a real button so it works from the keyboard
       and reads as interactive, but it has to look like the row it replaced. */
    .v-rowhead {
      display: block; width: 100%; padding: 0; margin: 0; text-align: left;
      background: none; border: none; font: inherit; color: inherit; cursor: pointer;
    }
    .v-rowhead:focus-visible { outline: 2px solid #cfe1f7; outline-offset: 3px; border-radius: 6px; }
    .v-rowhead .v-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .v-rowhead .v-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .v-chev { color: #b4bcc8; font-size: 0.8rem; flex: none; }
    .v-row.open { align-items: start; }
    .v-row.open .v-check { margin-top: 3px; }
    .v-row.open .v-chev { color: var(--accent); }
    .v-rowhead:hover .v-title { color: var(--accent); }
    .v-row.closed .v-rowhead { padding-bottom: 2px; }
    /* The badge sits inline with the title now, so it needs to stop stretching. */
    .v-rowhead .v-badge { flex: none; }

    .v-expandbar { display: flex; justify-content: flex-end; margin-bottom: 4px; }
    .v-expandall {
      padding: 4px 10px; min-height: 28px;
      border: 1px solid var(--border); border-radius: 999px; background: #fff;
      font-size: 0.74rem; font-family: inherit; color: var(--muted); cursor: pointer;
    }
    .v-expandall:hover { border-color: var(--accent); color: var(--accent); }
    /* Payments between families */
    .pay-list { list-style: none; margin: 8px 0 0; padding: 0; }
    .pay-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 0; border-bottom: 1px solid #f0f2f6; font-size: 0.9rem; }
    .pay-list li:last-child { border-bottom: none; }
    .pay-main .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
    .pay-sub { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .pay-add { margin-top: 12px; }
    .pay-add > summary { cursor: pointer; font-size: 0.84rem; font-weight: 600;
      color: var(--accent); list-style: none; padding: 4px 0; }
    .pay-add > summary::-webkit-details-marker { display: none; }
    .pay-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
      margin-top: 10px; padding: 14px; border-radius: 10px; background: #f7f8fa; }
    .pay-form label { display: flex; flex-direction: column; gap: 4px;
      font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .pay-form label .opt { font-weight: 400; color: #98a0ad; }
    .pay-form input, .pay-form select {
      padding: 8px 9px; min-height: 38px; width: 100%;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .pay-wide, .pay-actions { grid-column: 1 / -1; }
    .pay-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .pay-actions button {
      padding: 9px 16px; min-height: 40px; border: none; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 0.88rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .pay-actions button:hover { background: #0055ad; }
    .pay-msg { font-size: 0.78rem; color: #b3261e; font-weight: 600; }

    @media (max-width: 520px) {
      .pay-form { grid-template-columns: 1fr; }
    }


    /* --- Top-level tabs --------------------------------------------------- */
    /* The page was one long column; on a phone, "what do I owe" was a very long
       scroll and the deadlines sat in the middle of it. */
    .tabs {
      display: flex; gap: 4px; margin: 0 0 18px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1 1 0; min-height: 44px; padding: 10px 8px;
      border: none; border-bottom: 2px solid transparent; background: transparent;
      font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 7px; white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-badge {
      min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
      background: var(--muted); color: #fff;
      font-size: 0.68rem; font-weight: 700; line-height: 19px; text-align: center;
    }
    .tab-badge.over { background: #b3261e; }
    .tab-badge.soon { background: #9a6700; }

    /* --- Schedule: what needs doing ------------------------------------- */
    /* Urgency is carried by colour in both views, from one shared rule in
       taskUrgency(), so the list and the calendar can never disagree. */
    .sched-head { display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; }
    .sched-title { font-size: 1.05rem; font-weight: 700; }
    .sched-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; }
    .sched-toggle button {
      padding: 7px 14px; min-height: 36px; border: none; background: #fff;
      font: inherit; font-size: 0.84rem; color: var(--muted); cursor: pointer;
    }
    .sched-toggle button.on { background: var(--accent); color: #fff; font-weight: 600; }
    .sched-sum { font-size: 0.82rem; color: var(--muted); margin: 6px 0 12px; }
    .sched-sum .s-over { color: #b3261e; font-weight: 600; }
    .sched-sum .s-soon { color: #9a6700; font-weight: 600; }

    .sched-band {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 700; color: var(--muted); margin: 14px 0 4px;
      padding-bottom: 3px; border-bottom: 1px solid var(--border);
    }
    .sched-band.overdue { color: #b3261e; }
    .sched-band.soon { color: #9a6700; }

    .task { display: grid; grid-template-columns: auto 1fr auto;
      gap: 4px 10px; align-items: start; padding: 10px 0;
      border-bottom: 1px solid #f0f2f6; }
    .task:last-child { border-bottom: none; }
    .task-tick { margin-top: 3px; width: 18px; height: 18px; flex: none; cursor: pointer; }
    .task-title { font-size: 0.94rem; font-weight: 600; }
    .task.is-closed .task-title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
    .task-kind { padding: 1px 7px; border-radius: 999px; background: #eef1f6;
      color: #44506b; font-weight: 600; }
    .task-kind.k-payment { background: #fdecea; color: #a3372c; }
    .task-kind.k-booking { background: #e8f1fd; color: #1a4e8a; }
    .task-kind.k-reimbursement { background: #fff4e2; color: #8a5a00; }
    .task-who { font-weight: 600; color: #44506b; }
    .task.overdue .task-due { color: #b3261e; font-weight: 700; }
    .task.soon .task-due { color: #9a6700; font-weight: 600; }
    .task-state { font-style: italic; }
    .task-link, .task-notes { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .task-notes { white-space: pre-wrap; }
    .task-right { display: flex; align-items: center; gap: 10px; }
    .task-amt { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
    .task-edit { border: 1px solid var(--border); background: #fff; border-radius: 7px;
      padding: 5px 11px; min-height: 32px; font: inherit; font-size: 0.78rem;
      color: var(--accent); cursor: pointer; }
    .task-edwrap { grid-column: 1 / -1; }

    .task-ed { margin-top: 10px; padding: 14px; border-radius: 10px; background: #f7f8fa; }
    .task-edgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .task-edf { display: flex; flex-direction: column; gap: 4px;
      font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .task-edf.wide { grid-column: 1 / -1; margin-top: 10px; }
    .task-ed input, .task-ed select, .task-ed textarea {
      padding: 8px 9px; min-height: 38px; width: 100%;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .task-ed textarea { min-height: 54px; resize: vertical; }
    .task-edfoot { margin-top: 12px; }
    .task-del { border: 1px solid #e9c9c4; background: #fff; color: #a3372c;
      border-radius: 8px; padding: 8px 14px; min-height: 38px;
      font: inherit; font-size: 0.8rem; cursor: pointer; }
    .task-del.armed { background: #b3261e; border-color: #b3261e; color: #fff; font-weight: 600; }

    .task-add { margin-top: 14px; }
    .task-add > summary { cursor: pointer; font-size: 0.84rem; font-weight: 600;
      color: var(--accent); list-style: none; padding: 4px 0; }
    .task-add > summary::-webkit-details-marker { display: none; }
    .task-addform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
      margin-top: 10px; padding: 14px; border-radius: 10px; background: #f7f8fa; }
    .task-addform input, .task-addform select {
      padding: 8px 9px; min-height: 38px; width: 100%;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .task-addform input[name="title"] { grid-column: 1 / -1; }
    .task-addform button { grid-column: 1 / -1; padding: 9px 16px; min-height: 40px;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; }

    /* --- Calendar ------------------------------------------------------- */
    .cal-nav { display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 4px 0 10px; }
    .cal-nav button { width: 38px; height: 38px; border: 1px solid var(--border);
      background: #fff; border-radius: 8px; font-size: 1.1rem; line-height: 1;
      color: var(--ink); cursor: pointer; }
    .cal-month { font-weight: 700; font-size: 0.98rem; min-width: 10.5em; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 0.68rem; font-weight: 700;
      color: var(--muted); padding-bottom: 4px; }
    .cal-cell { min-height: 62px; border: 1px solid var(--border); border-radius: 7px;
      padding: 3px 4px; background: #fff; overflow: hidden; }
    .cal-cell.pad { border: none; background: transparent; }
    .cal-cell.has { cursor: pointer; }
    .cal-cell.is-today { border-color: var(--accent); }
    .cal-cell.is-sel { outline: 2px solid var(--accent); outline-offset: -2px; }
    .cal-cell.u-overdue { background: #fdecea; border-color: #f0c3bd; }
    .cal-cell.u-soon { background: #fff8e8; border-color: #ecd9a8; }
    .cal-cell.u-closed { background: #f4f5f6; }
    .cal-num { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .cal-cell.is-today .cal-num { color: var(--accent); }
    .cal-pill { font-size: 0.62rem; line-height: 1.25; margin-top: 2px; padding: 1px 3px;
      border-radius: 3px; background: #eef1f6; color: #44506b;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-pill.overdue { background: #f7d3cd; color: #8a2b21; font-weight: 600; }
    .cal-pill.soon { background: #fbe7bd; color: #7a4f00; font-weight: 600; }
    .cal-pill.closed { text-decoration: line-through; opacity: 0.65; }
    .cal-more { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }
    .cal-note { font-size: 0.76rem; color: var(--muted); margin-top: 10px; }
    .cal-day { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
    .cal-dayhead { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; }

    @media (max-width: 520px) {
      .task-edgrid, .task-addform { grid-template-columns: 1fr; }
      /* A phone cannot show a readable title in a 44px column, so the grid becomes a
         density map — colour and a count — and the detail comes from tapping a day. */
      .cal-cell { min-height: 46px; }
      .cal-pill { display: none; }
      .cal-more { display: none; }
      .cal-cell.has::after { content: ""; display: block; width: 6px; height: 6px;
        border-radius: 50%; background: #44506b; margin: 3px auto 0; }
      .cal-cell.u-overdue::after { background: #b3261e; }
      .cal-cell.u-soon::after { background: #9a6700; }
      .cal-cell.u-closed::after { background: #b6bcc4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="viewRoot"></div>
  </div>
  <script src="config.js?v=3"></script>
  <script src="backend.js?v=1"></script>
  <script src="booking.js?v=6"></script>
  <script src="group.js?v=16"></script>
</body>
</html>
