<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Tracker</title>
  <style>
    :root {
      --bg: #fafaf7;
      --ink: #1d1d1f;
      --muted: #6b6b6b;
      --accent: #0066cc;
      --border: #e3e3df;
      --row-alt: #f3f3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.45;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.92rem; }
    .panel {
      background: white; border: 1px solid var(--border); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 20px;
    }
    .area-heading {
      font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin: 4px 0 6px; font-weight: 600;
    }
    /* Plain item row */
    .v-row {
      display: grid; grid-template-columns: 24px 1fr auto; gap: 12px;
      align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border);
    }
    .v-row:last-child { border-bottom: none; }
    .v-row.excluded { opacity: 0.45; }
    .v-check { width: auto; margin: 0; cursor: pointer; }
    .v-fixed { width: 18px; text-align: center; color: var(--muted); }
    .v-title { font-weight: 500; }
    .v-title .v-icon { margin-right: 6px; }
    .v-sub { display: block; margin-left: 24px; color: var(--muted); font-size: 0.78rem; }
    .v-cost { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
    .v-perperson { display: block; font-size: 0.74rem; color: var(--muted); font-weight: 400; margin-top: 1px; }

    /* Choice-group dropdown card */
    .v-group {
      border: 1px solid #d9d2ef; border-radius: 9px; background: #faf9fd;
      padding: 12px 14px; margin: 12px 0;
    }
    .v-group.none { opacity: 0.55; }
    .v-group-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .v-group-title { font-weight: 600; color: #3a2a6b; }
    .v-group-title .v-icon { margin-right: 6px; }
    .v-group-meta { color: var(--muted); font-size: 0.8rem; font-weight: 400; margin-left: 6px; }
    .v-group-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .v-group select {
      flex: 1 1 260px; padding: 9px 10px; border: 1px solid var(--border);
      border-radius: 7px; font-size: 0.95rem; background: white; color: var(--ink);
    }
    .v-group-cost { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .v-group-cost.none { color: var(--muted); font-weight: 400; font-style: italic; }

    /* Total */
    .total-panel {
      background: linear-gradient(180deg, white, #f7f4ec);
      border: 1px solid var(--border); border-top: 3px solid var(--accent);
    }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
    .total-row .label { color: var(--muted); font-size: 0.9rem; }
    .total-row .val { font-variant-numeric: tabular-nums; }
    .total-row.grand { margin-top: 8px; padding-top: 14px; border-top: 2px solid var(--ink); }
    .total-row.grand .label { color: var(--ink); font-size: 1rem; font-weight: 600; }
    .total-row.grand .val { font-size: 1.9rem; font-weight: 600; color: var(--accent); }
    .total-note { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }

    .empty { color: var(--muted); padding: 40px 6px; text-align: center; }
    .empty a { color: var(--accent); }

    @media (max-width: 560px) {
      .container { padding: 14px; }
      .v-row { grid-template-columns: 24px 1fr auto; }
    }

    /* Estimate-vs-actual + booking details in the shared view */
    .v-var { display: block; font-size: 0.72rem; font-weight: 500; margin-top: 1px; }
    .v-var.over { color: #b3261e; }
    .v-var.under { color: #1d7a45; }
    .v-badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
      font-size: 0.7rem; font-weight: 600; }
    .v-badge.st-est { background: #eef1f6; color: #5a6475; }
    .v-badge.st-booked { background: #e3f0ff; color: #1b5fa8; }
    .v-badge.st-paid { background: #e2f5e9; color: #1d7a45; }
    .v-conf { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.74rem; }
    table.v-ledger { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.v-ledger th { text-align: right; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: .03em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid #e6e9ef; }
    table.v-ledger th:first-child, table.v-ledger td:first-child { text-align: left; }
    table.v-ledger td { text-align: right; padding: 6px; border-bottom: 1px solid #f0f2f6; }
    table.v-ledger td.net.pos { color: #1d7a45; font-weight: 600; }
    table.v-ledger td.net.neg { color: #b3261e; font-weight: 600; }

    .you-head { font-size: 0.76rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .you-pick { width: 100%; max-width: 420px; font: inherit; font-size: 0.95rem;
      padding: 8px 10px; border: 1px solid #d7dce5; border-radius: 7px; background: #fff; }
    .you-note { font-size: 0.8rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .you-body { margin-top: 12px; }
    .you-big { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; }
    .you-big.neg { color: #b3261e; }
    .you-big.pos { color: #1d7a45; }
    .you-detail { margin-top: 10px; font-size: 0.86rem; }
    .you-detail summary { cursor: pointer; color: var(--muted); }
    table.you-lines { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.86rem; }
    table.you-lines td { padding: 5px 0; border-bottom: 1px solid #f0f2f6; }
    table.you-lines td.amt { text-align: right; font-weight: 600; white-space: nowrap; }
    table.v-ledger tr.is-me { background: #f3f8ff; }
    table.v-ledger tr.is-me td:first-child { font-weight: 700; }
    ul.settle { list-style: none; padding: 0; margin: 0; }
    ul.settle li { padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid #f0f2f6; }
    ul.settle li:last-child { border-bottom: none; }
    ul.settle li.is-me { font-weight: 600; }
    ul.settle .amt { float: right; }

    .v-detail { display: block; margin-top: 6px; }
    .v-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .v-chip { display: inline-block; padding: 1px 8px; border-radius: 9px;
      background: #eef1f6; color: #5a6475; font-size: 0.72rem; }
    .v-confbox { display: inline-flex; align-items: center; gap: 4px;
      background: #f2f6fc; border: 1px solid #d6e2f2; border-radius: 7px; padding: 1px 4px 1px 8px; }
    .v-conf { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem; font-weight: 600; letter-spacing: .02em; color: #14396b; }
    .v-copy { font: inherit; font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .04em; border: none; background: transparent; color: #1b5fa8;
      cursor: pointer; padding: 3px 5px; border-radius: 5px; }
    .v-copy:hover { background: #e2ecfa; }
    .v-link { display: inline-block; margin-top: 6px; font-size: 0.8rem; color: #1b5fa8; }
    .v-notes { margin-top: 6px; font-size: 0.8rem; color: #5a6475; line-height: 1.5;
      white-space: pre-wrap; }
    .v-notes-wrap { margin-top: 6px; }
    .v-notes-wrap > summary { list-style: none; cursor: pointer; font-size: 0.8rem;
      color: #5a6475; line-height: 1.5; }
    .v-notes-wrap > summary::-webkit-details-marker { display: none; }
    .v-notes-wrap > summary::after { content: " more"; color: #1b5fa8; font-weight: 600; font-size: 0.74rem; }
    .v-notes-wrap[open] > summary::after { content: " less"; }
    .v-notes-wrap[open] > summary { color: #98a0ad; }
    .v-notes-wrap > .v-notes { margin-top: 4px; }
    .v-split { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px;
      padding-top: 7px; border-top: 1px dashed #e6e9ef; font-size: 0.78rem; color: #5a6475; }
    .v-shr .n { color: #98a0ad; }
    details.v-refs summary { cursor: pointer; font-size: 0.76rem; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .v-count { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px;
      border-radius: 9px; background: #eef1f6; font-size: 0.7rem; text-align: center; }
    table.v-reftable { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table.v-reftable td { padding: 7px 0; border-bottom: 1px solid #f0f2f6;
      font-size: 0.86rem; vertical-align: top; }
    table.v-reftable tr:last-child td { border-bottom: none; }
    table.v-reftable td.c { text-align: right; white-space: nowrap; padding-left: 10px; }
    .v-refwhen { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 1px; }
    /* --- Shared editing ------------------------------------------------- */
    /* Every control here writes to the one shared copy, so each is labelled with
       who it affects. Touch targets are sized for a phone at a hotel check-in. */
    .v-save { min-height: 20px; margin: -6px 0 14px; font-size: 0.8rem; color: var(--muted); }
    .v-save.pending { color: #8a6d00; }
    .v-save.ok { color: #1f7a3d; }
    .v-save.bad { color: #b3261e; font-weight: 600; }

    .v-tools { margin-top: 8px; }
    .v-del {
      padding: 5px 10px; min-height: 30px;
      border: 1px solid var(--border); border-radius: 7px;
      background: #fff; color: var(--muted);
      font-size: 0.76rem; font-family: inherit; cursor: pointer;
    }
    .v-del:hover { border-color: #d9b3b0; color: #b3261e; }
    .v-del.armed { border-color: #b3261e; background: #fdf1f0; color: #b3261e; font-weight: 600; }

    /* Participation toggles. "On" carries the family's share of this line; "off" is
       visibly struck through, because the difference decides who owes what. */
    .v-split-edit { gap: 6px; }
    .v-shrtog {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; min-height: 30px;
      border: 1px solid var(--border); border-radius: 999px;
      background: #fff; color: #98a0ad;
      font-size: 0.78rem; font-family: inherit; cursor: pointer;
    }
    .v-shrtog .mark { font-size: 0.72rem; }
    .v-shrtog:not(.on) .n { text-decoration: line-through; }
    .v-shrtog.on { border-color: #c8dcf2; background: #f2f8ff; color: #2b3a4d; }
    .v-shrtog.on .n { color: #2b3a4d; font-weight: 600; }
    .v-shrtog.on .amt { color: #5a6475; }
    .v-shrtog:hover { border-color: var(--accent); }

    /* Add form */
    .v-addwrap { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .v-addwrap > summary {
      cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--accent);
      padding: 6px 0; list-style: none;
    }
    .v-addwrap > summary::-webkit-details-marker { display: none; }
    .v-addform {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
      margin-top: 10px; padding: 14px; border-radius: 10px; background: #f7f8fa;
    }
    .v-addform label { display: flex; flex-direction: column; gap: 4px;
      font-size: 0.76rem; font-weight: 600; color: var(--muted); }
    .v-addform label .opt { font-weight: 400; text-transform: none; color: #98a0ad; }
    .v-addform input, .v-addform select {
      padding: 8px 9px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
    }
    .v-addform input:focus, .v-addform select:focus { outline: 2px solid #cfe1f7; border-color: var(--accent); }
    .v-addfams, .v-addhint, .v-addactions { grid-column: 1 / -1; }
    .v-addfams .lbl { display: block; font-size: 0.76rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .v-addfams .fams { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .v-addfams .fam { display: inline-flex; flex-direction: row; align-items: center; gap: 6px;
      font-size: 0.86rem; font-weight: 400; color: var(--ink); }
    .v-addhint { font-size: 0.76rem; color: var(--muted); }
    .v-addactions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .v-addactions button {
      padding: 9px 16px; min-height: 40px;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 0.88rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .v-addactions button:hover { background: #0055ad; }
    .v-addnote { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 520px) {
      .v-addform { grid-template-columns: 1fr; }
    }
    /* --- Per-item edit panel --------------------------------------------- */
    .v-edit {
      padding: 5px 10px; min-height: 30px; margin-right: 6px;
      border: 1px solid var(--border); border-radius: 7px;
      background: #fff; color: var(--accent);
      font-size: 0.76rem; font-family: inherit; cursor: pointer;
    }
    .v-edit:hover { border-color: var(--accent); }
    .v-edit.open { background: var(--accent); border-color: var(--accent); color: #fff; }

    .ed-panel {
      margin-top: 10px; padding: 14px;
      border: 1px solid #d8e4f2; border-radius: 10px; background: #f7fafd;
    }
    .ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .ed-wide { grid-column: 1 / -1; }
    .ed-field { display: flex; flex-direction: column; gap: 4px; }
    .ed-lab { font-size: 0.74rem; font-weight: 600; color: var(--muted); }
    .ed-hint { font-size: 0.7rem; color: #98a0ad; line-height: 1.3; }
    .ed-field input, .ed-field select, .ed-field textarea {
      padding: 8px 9px; min-height: 38px;
      border: 1px solid var(--border); border-radius: 7px; background: #fff;
      font-size: 0.92rem; font-family: inherit; color: var(--ink);
      width: 100%;
    }
    .ed-field textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
    .ed-field input:focus, .ed-field select:focus, .ed-field textarea:focus {
      outline: 2px solid #cfe1f7; border-color: var(--accent);
    }
    .ed-foot {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2ebf5;
    }
    .ed-done {
      padding: 8px 16px; min-height: 36px;
      border: none; border-radius: 8px; background: var(--accent); color: #fff;
      font-size: 0.84rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }
    .ed-done:hover { background: #0055ad; }
    .ed-footnote { font-size: 0.74rem; color: var(--muted); }

    @media (max-width: 520px) {
      .ed-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="viewRoot"></div>
  </div>
  <script src="config.js?v=2"></script>
  <script src="booking.js?v=4"></script>
  <script src="group.js?v=3"></script>
</body>
</html>
